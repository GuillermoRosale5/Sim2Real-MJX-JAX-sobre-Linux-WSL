[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sim2real-mjx-jax"
version = "0.7.0"
description = "Entorno Sim2Real sobre MJX/JAX para Ubuntu nativo y WSL2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "brax==0.14.2",
  "flax==0.11.2",
  "jax==0.6.2",
  "jaxlib==0.6.2",
  "matplotlib>=3.10,<3.11",
  "ml-collections==1.1.0",
  "mujoco==3.6.0",
  "mujoco-mjx==3.6.0",
  "playground @ git+https://github.com/google-deepmind/mujoco_playground.git@9c2dce4a3519cd4bb9d299bf28a6ef3f5086844b",
  "optax==0.2.6",
  "orbax-checkpoint==0.11.31",
  "warp-lang==1.11.0",
]

[project.optional-dependencies]
# CUDA es un extra reproducible del proyecto. AMD se instala de forma separada
# porque ROCm necesita un wheel jaxlib parcheado (no el jaxlib de PyPI).
nvidia = ["jax[cuda12]==0.6.2"]

[tool.hatch.build.targets.wheel]
packages = ["sim2real_mjx"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
